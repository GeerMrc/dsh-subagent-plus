# Release chain: a pushed v* tag runs the same four gates as a local release,
# then creates the GitHub Release with the tarball attached. npm publishing is
# deliberately NOT automated (2026-11-06): account 2FA is passkey-only, the
# NPM_TOKEN secret value cannot be re-verified, and bypass-2FA tokens lose
# direct publish rights in 2027-01 (docs/dont-do.md "npm 认证与删除").
# Publish manually from a user terminal after this workflow greens:
#   npm publish ./dist-artifacts/dsh-subagent-plus-<ver>.tgz \
#     --registry https://registry.npmjs.org --access public
# Kept lessons from real incidents (dsh-websearch session-38): release create
# falls back to upload so a re-run after a half-created release still works.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      # dist-artifacts/ is gitignored; npm pack requires the destination to
      # exist (ENOENT on fresh checkout — dsh-websearch session-38 incident B).
      - run: mkdir -p dist-artifacts && npm pack --pack-destination dist-artifacts
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes dist-artifacts/*.tgz || gh release upload "$GITHUB_REF_NAME" dist-artifacts/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
