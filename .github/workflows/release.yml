# Release chain: a pushed v* tag runs the same four gates as a local release,
# creates the GitHub Release with the tarball attached, then publishes to npm
# via trusted publishing (OIDC) — no stored npm token. Requirements
# (docs.npmjs.com/trusted-publishers): id-token: write, npm CLI >= 11.5.1 on
# Node >= 22.14 (the runner's bundled npm is too old — upgraded below), and a
# trusted-publisher binding on npmjs.com: package Settings → Trusted
# publishing → GitHub Actions (owner GeerMrc, repo dsh-subagent-plus, workflow
# release.yml, "Allow npm publish" on). The binding expires unless the first
# successful publish happens within 2 days — create it on release day. If the
# OIDC publish fails, publish manually from a user terminal (docs/upgrade.md
# §6) — the GitHub Release is already created at that point.
# Kept lessons from real incidents (dsh-websearch session-38): release create
# falls back to upload so a re-run after a half-created release still works.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write # required for npm trusted publishing (OIDC)
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Pre-flight BEFORE any side effect (PH6): the tag must name the version
      # in this tree, the tree must not be private (the release commit removes
      # "private"), and that version must not already be on npm. Without this
      # gate a bad tree fails only at `npm publish` — after the GitHub Release
      # and its tag already exist.
      - run: node scripts/release-preflight.mjs "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      # dist-artifacts/ is gitignored; npm pack requires the destination to
      # exist (ENOENT on fresh checkout — dsh-websearch session-38 incident B).
      - run: mkdir -p dist-artifacts && npm pack --pack-destination dist-artifacts
      # P7 pack verification — assert the TARBALL (not the repo) carries every
      # meta.detail target and no internal governance doc leaked through the
      # files whitelist (the sibling's v0.0.1 incident: contract tests checked
      # only source-repo existence).
      - name: verify tarball contents (P7)
        run: |
          set -eu
          TARBALL=dist-artifacts/dsh-subagent-plus-*.tgz
          LIST=$(tar -tzf $TARBALL)
          for f in docs/plugin-page.zh.md docs/plugin-page.en.md docs/settings.md docs/strategy.md docs/upgrade.md; do
            echo "$LIST" | grep -qx "package/$f" || { echo "P7 FAIL: $f missing from tarball"; exit 1; }
          done
          if echo "$LIST" | grep -qE '^package/docs/(decisions/|dont-do\.md|e2e-manual\.md|release-runbook\.md|upstream-feedback)'; then
            echo 'P7 FAIL: internal governance docs leaked into the tarball'; exit 1
          fi
          echo 'P7 OK: detail targets present, no governance leak'
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes dist-artifacts/*.tgz || gh release upload "$GITHUB_REF_NAME" dist-artifacts/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # Trusted publishing needs npm >= 11.5.1; the Node 22 image bundles 10.x.
      # npm@11 is pinned by major: npm 12 may raise the Node floor and break
      # release day (pair badly with the 2-day binding window).
      - run: npm install -g npm@11
      - run: npm publish ./dist-artifacts/dsh-subagent-plus-*.tgz --registry https://registry.npmjs.org --access public
